# NEXUS.IA — Nginx v24 (SPA repair + clean config)
map $http_sec_fetch_mode $sec_fetch_navigate {
    "navigate" 1;
    default    0;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80; listen [::]:80;
    server_name smartmoon.online www.smartmoon.online;
    location /.well-known/acme-challenge/ { root /var/www/certbot; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS principal ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name smartmoon.online www.smartmoon.online;

    ssl_certificate     /etc/letsencrypt/live/smartmoon.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartmoon.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    root /var/www/nexus;
    index index.html;

    client_max_body_size 50M;

    # ── Security ──────────────────────────────────────────────────────────────
    location ~ /\.env { deny all; }
    location ~ /\.git { deny all; }

    # ── index.html — never cache ──────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    # ── Static assets — long cache ────────────────────────────────────────────
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Uploads ───────────────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Admin: SPA + API (auto-detect) ──────────────────────────────────────
    # Qualquer /admin/* rota: se browser navega, serve SPA.
    # Se e fetch/XHR, faz proxy para o backend FastAPI.
    location ~ ^/admin/ {
        # Navegacao do browser (sec-fetch-mode: navigate) → SPA
        if ($sec_fetch_navigate) {
            return 418;
        }
        # Fallback: se Accept inclui text/html e nao json → tambem SPA
        set $is_page_nav 0;
        if ($http_accept ~* "text/html") {
            set $is_page_nav 1;
        }
        if ($http_accept ~* "application/json") {
            set $is_page_nav 0;
        }
        if ($is_page_nav = 1) {
            return 418;
        }
        error_page 418 = @spa_fallback;

        # API calls → proxy para backend
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    # ── Pure API routes (nunca servem SPA) ───────────────────────────────────
    location ~ ^/(crm/(contacts|tags|quick-replies|operators|messages|broadcasts|metrics)|storage|v1|api-keys|audio|auth|health|metrics|webhook|openapi\.json|docs|redoc|ollama|tts|whatsapp|telegram|google|connections|database|campaign-posts|luna) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_connect_timeout 60s;
        proxy_buffering off;
    }

    # ── Dual routes: SPA page + API endpoint ─────────────────────────────────
    # Sec-Fetch-Mode: navigate (browser navigation) → serve SPA index.html
    # Qualquer outra requisicao (XHR/fetch) → proxy para FastAPI
    location ~ ^/(bids|chat|marketing|studio|store|voice|flows|executions|agents|skills|settings|integrations|billing|payments|agent) {
        if ($sec_fetch_navigate) {
            return 418;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_connect_timeout 60s;
        proxy_buffering off;
        error_page 418 = @spa_fallback;
    }

    # ── Named locations ───────────────────────────────────────────────────────
    location @spa_fallback {
        root /var/www/nexus;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =500;
    }

    location @api_proxy {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; proxy_send_timeout 300s;
        proxy_buffering off;
    }

