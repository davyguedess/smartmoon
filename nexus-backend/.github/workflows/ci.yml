name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexuspwd
          POSTGRES_DB: nexusdb
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install
      - name: Run lint
        run: poetry run flake8 .
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexuspwd@localhost:5432/nexusdb
        run: poetry run pytest -q
      - name: Build Docker image
        run: docker build -t nexus-backend:ci .
